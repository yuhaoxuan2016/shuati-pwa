<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-64.png?v=0.2.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#42b883" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>刷题宝</title>
    <!-- 社交平台分享预览卡片（Open Graph / Twitter Card）
         站点地址由构建环境变量注入（.env 提供，不进 git 仓库）：
         %VITE_DEFAULT_CLOUD_ENV_ID% = 环境 ID，%VITE_TENCENT_APPID% = 腾讯云 AppID -->
    <meta property="og:title" content="刷题宝" />
    <meta property="og:description" content="导题 刷题 考试，就用刷题宝" />
    <meta property="og:image" content="https://%VITE_DEFAULT_CLOUD_ENV_ID%-%VITE_TENCENT_APPID%.tcloudbaseapp.com/share-card.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://%VITE_DEFAULT_CLOUD_ENV_ID%-%VITE_TENCENT_APPID%.tcloudbaseapp.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="刷题宝" />
    <meta name="twitter:description" content="导题 刷题 考试，就用刷题宝" />
    <meta name="twitter:image" content="https://%VITE_DEFAULT_CLOUD_ENV_ID%-%VITE_TENCENT_APPID%.tcloudbaseapp.com/share-card.png" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
